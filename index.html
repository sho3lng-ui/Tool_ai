<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HETAT | منظم العمل الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #4A90E2; /* اللون الأزرق المحدد للهوية */
            --primary-hover: #357ABD;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* الهيدر */
        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* شبكة التحكم الرئيسية */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .main-grid {
                grid-template-columns: 4fr 6fr;
            }
        }

        /* الكروت وتصميم الـ Flat 2.0 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            height: fit-content;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            resize: none;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* الملخص الذكي */
        .summary-box {
            background: rgba(74, 144, 226, 0.08);
            border-right: 4px solid var(--primary-color);
            padding: 1rem;
            border-radius: 4px 12px 12px 4px;
            margin-bottom: 2rem;
            font-weight: 500;
            display: none;
        }

        /* جدول المهام الاحترافي */
        .table-container {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            padding: 1rem;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 1.2rem 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: var(--text-main);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* شارات الأولوية والتصنيف (Badges) */
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
        }

        .badge-high { background-color: #fee2e2; color: var(--danger); }
        .badge-medium { background-color: #fef3c7; color: var(--warning); }
        .badge-low { background-color: #d1fae5; color: var(--success); }

        .badge-work { background-color: #e0f2fe; color: #0369a1; }
        .badge-personal { background-color: #f3e8ff; color: #6b21a8; }
        .badge-study { background-color: #e0e7ff; color: #3730a3; }
        .badge-health { background-color: #d1fae5; color: #065f46; }

        /* الشاشات الفارغة وحالة التحميل */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--border-color);
        }

        .spinner {
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> HETAT AI</h1>
        <p>اكتب أفكارك ومفكرتك العشوائية، ودع الذكاء الاصطناعي ينظم عملك ويجدول يومك</p>
    </header>

    <div class="main-grid">
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-pen-to-square" style="color: var(--primary-color);"></i>
                <span>ماذا يدور في ذهنك اليوم؟</span>
            </div>
            <textarea id="userInput" placeholder="مثال: عندي اجتماع مهم الساعة 1 بعد الظهر مع فريق الميديا، وعايز أراجع اسكريبت الحلقة الجديدة بكرة الصبح، وماتنساش تفكرني أشرب مية وأروح الجيم الساعة 8..."></textarea>
            <button id="generateBtn" onclick="processSchedule()">
                <i class="fa-solid fa-bolt" id="btnIcon"></i>
                <span id="btnText">تنظيم وجدولة اليوم ذكياً</span>
            </button>
        </div>

        <div class="card" style="width: 100%;">
            <div class="card-title">
                <i class="fa-solid fa-calendar-days" style="color: var(--success);"></i>
                <span>جدول العمل والمهام الذكي</span>
            </div>

            <div id="summaryBox" class="summary-box"></div>

            <div id="outputArea">
                <div class="empty-state">
                    <i class="fa-solid fa-calendar-xmark"></i>
                    <p>لا يوجد جدول حالياً. اكتب مهامك في الجانب الأيمن واضغط على الزر لتوليد جدولك فوراً.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function processSchedule() {
        const inputTextArea = document.getElementById('userInput');
        const generateBtn = document.getElementById('generateBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const summaryBox = document.getElementById('summaryBox');
        const outputArea = document.getElementById('outputArea');

        const userText = inputTextArea.value.trim();
        if (!userText) {
            alert('من فضلك اكتب أي نص أو مهام أولاً ليقوم الذكاء الاصطناعي بتنظيمها.');
            return;
        }

        // تحويل الزر لحالة التحميل (Loading)
        generateBtn.disabled = true;
        btnIcon.className = "fa-solid fa-circle-notch spinner";
        btnText.innerText = "جاري التحليل والجدولة...";

        try {
            // استدعاء الـ API الخاص بنا المبني على Vercel تلقائياً بنفس الرابط المضيف
            const response = await fetch('/api/schedule', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: userText })
            });

            if (!response.ok) {
                throw new Error('حدث خطأ في السيرفر أثناء معالجة البيانات.');
            }

            const data = await response.json();

            // 1. عرض الملخص الذكي
            summaryBox.innerHTML = `<i class="fa-solid fa-quote-right" style="margin-left:8px; color:var(--primary-color);"></i> ${data.summary}`;
            summaryBox.style.display = "block";

            // 2. بناء الجدول الاحترافي للمهام
            if (data.tasks && data.tasks.length > 0) {
                let tableHtml = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>المهمة</th>
                                    <th>الموعد / التوقيت</th>
                                    <th>الأولوية</th>
                                    <th>التصنيف</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.tasks.forEach(task => {
                    // تحديد شارة الأولوية
                    let priorityClass = 'badge-medium';
                    let priorityText = task.priority;
                    if (task.priority.toLowerCase() === 'high') { priorityClass = 'badge-high'; priorityText = 'عالية'; }
                    if (task.priority.toLowerCase() === 'medium') { priorityClass = 'badge-medium'; priorityText = 'متوسطة'; }
                    if (task.priority.toLowerCase() === 'low') { priorityClass = 'badge-low'; priorityText = 'منخفضة'; }

                    // تحديد شارة التصنيف وترجمتها للعرض
                    let catClass = 'badge-work';
                    let catText = task.category;
                    if (task.category.toLowerCase() === 'work') { catClass = 'badge-work'; catText = 'عمل'; }
                    if (task.category.toLowerCase() === 'personal') { catClass = 'badge-personal'; catText = 'شخصي'; }
                    if (task.category.toLowerCase() === 'study') { catClass = 'badge-study'; catText = 'دراسة'; }
                    if (task.category.toLowerCase() === 'health') { catClass = 'badge-health'; catText = 'صحة / رياضة'; }

                    tableHtml += `
                        <tr>
                            <td style="font-weight: 500;">${task.title}</td>
                            <td style="color: var(--text-muted);"><i class="fa-regular fa-clock" style="margin-left:5px;"></i>${task.time}</td>
                            <td><span class="badge ${priorityClass}">${priorityText}</span></td>
                            <td><span class="badge ${catClass}">${catText}</span></td>
                        </tr>
                    `;
                });

                tableHtml += `
                            </tbody>
                        </table>
                    </div>
                `;
                outputArea.innerHTML = tableHtml;
            } else {
                outputArea.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation" style="color:var(--warning);"></i>
                        <p>استطاع الذكاء الاصطناعي قراءة النص، لكن لم يجد مهام واضحة لجدولتها. حاول توضيح الأنشطة أكثر.</p>
                    </div>
                `;
            }

        } catch (error) {
            console.error(error);
            outputArea.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-circle-exclamation" style="color:var(--danger);"></i>
                    <p style="color:var(--danger);">عذراً، حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من إعداد الـ Secrets بشكل صحيح.</p>
                </div>
            `;
        } finally {
            // إعادة الزر لوضعه الطبيعي
            generateBtn.disabled = false;
            btnIcon.className = "fa-solid fa-bolt";
            btnText.innerText = "تنظيم وجدولة اليوم ذكياً";
        }
    }
</script>
</body>
</html>
